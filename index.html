<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ojas</title>
<meta name="description" content="Ojas — personal health transformation tracker">
<meta name="theme-color" content="#0a111c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ojas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a111c; --surface:#121c2b; --surface-2:#182436; --fg:#e6eefa; --muted:#93a5c0; --border:#22314a;
  --accent:#4f8ff7; --accent-2:#38bdf8; --accent-3:#6366f1; --accent-weak:#16274a; --on-accent:#fff;
  --kcal:#f59e0b; --prot:#14b8a6; --carb:#60a5fa; --fat:#a78bfa;
  --good:#14b8a6; --watch:#f59e0b; --crit:#ef4444;
  --grad:linear-gradient(135deg,#38bdf8 0%,#2563eb 60%,#1e40af 100%);
  --shadow:none; color-scheme:dark;
  --r:16px; --font-d:"Manrope",system-ui,sans-serif; --font-b:"Manrope",system-ui,sans-serif; --font-h:"Noto Sans Devanagari","Manrope",sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f1f6fd; --surface:#ffffff; --surface-2:#eef3fa; --fg:#0f1b2d; --muted:#5b6b82; --border:#dbe6f4;
  --accent:#2563eb; --accent-weak:#e0ebff; --good:#0d9488; --shadow:0 1px 2px rgba(15,27,45,.04),0 4px 14px rgba(15,27,45,.05); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f1f6fd; --surface:#ffffff; --surface-2:#eef3fa; --fg:#0f1b2d; --muted:#5b6b82; --border:#dbe6f4;
  --accent:#2563eb; --accent-weak:#e0ebff; --good:#0d9488; --shadow:0 1px 2px rgba(15,27,45,.04),0 4px 14px rgba(15,27,45,.05); color-scheme:light;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.hi{font-family:var(--font-h)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
/* header */
.hdr{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,106,61,.35)}
.logo svg{width:20px;height:20px}
.brand h1{margin:0;font-family:var(--font-d);font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.datenav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.datenav button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.datenav button:active{background:var(--surface-2)}
.datenav span{font-size:13px;font-weight:600;min-width:74px;text-align:center}
main{padding:4px 16px 20px}
.view{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 10px;font-family:var(--font-d);font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:500}
.sec-title{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;background:var(--grad);box-shadow:0 14px 34px rgba(255,61,127,.28);margin-bottom:14px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;background:#fff}
.hero::before{width:180px;height:180px;right:-60px;top:-70px;animation:float 9s ease-in-out infinite}
.hero::after{width:90px;height:90px;left:-30px;bottom:-40px;animation:float 7s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-14px,12px) scale(1.08)}}
.hero .greet{font-size:13px;opacity:.9;position:relative}
.hero .big{font-family:var(--font-d);font-size:24px;font-weight:800;letter-spacing:-.02em;position:relative;margin:2px 0 12px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring .rw{position:relative;width:100%;max-width:84px;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.25)}
.ring .bar{stroke:#fff;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);stroke-linecap:round}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:16px;line-height:1.05}
.ring .rv small{font-family:var(--font-b);font-size:10px;font-weight:600;opacity:.85}
.ring .lab{font-size:11.5px;font-weight:700;opacity:.95}
/* plain rings (light cards) */
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.mac div{background:var(--surface-2);border-radius:14px;padding:8px 4px}
.mac b{display:block;font-family:var(--font-d);font-size:16px}
.mac span{font-size:11px;color:var(--muted)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:active{transform:scale(.95)}
/* list items */
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.tl{grid-template-columns:minmax(0,1fr)}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:11px 12px;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:var(--shadow)}
.item:active{transform:scale(.98)}
.emo{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:26px;background:var(--accent-weak);position:relative}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{text-align:right;flex:none;font-size:12px;color:var(--muted)}
.item .meta b{display:block;font-family:var(--font-d);font-size:14px;color:var(--fg)}
.item .meta.exm{max-width:84px;white-space:normal}
.item .meta.exm b{font-size:12px;line-height:1.25;margin-bottom:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--good)} .dot.y{background:var(--watch)} .dot.r{background:var(--crit)}
.emo .dot{position:absolute;right:-2px;top:-2px;border:2px solid var(--surface);width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.p{background:color-mix(in srgb,var(--prot) 14%,transparent);color:var(--prot)}
/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:0 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;height:46px;outline:none;font-size:15px}
/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .2s;font-size:14.5px}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,61,127,.3)}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.btn.ghost{background:none;color:var(--accent);padding:8px 10px}
.btn.yt{background:#ff0033;color:#fff;flex:1}
.btn.yt.en{background:#1b1a22;color:#fff}
:root[data-theme="dark"] .btn.yt.en{background:#3a3846}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));z-index:40;
  display:grid;grid-template-columns:repeat(6,1fr);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:color .2s}
.tabs button svg{width:22px;height:22px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tabs button.on{color:var(--accent);background:var(--accent-weak)}
.tabs button.on svg{transform:translateY(-2px) scale(1.12)}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:41;width:58px;height:58px;border-radius:20px;border:0;background:var(--grad);color:#fff;
  box-shadow:0 10px 26px rgba(255,61,127,.45);cursor:pointer;display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.92)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,8,15,.45);z-index:60;opacity:0;transition:opacity .3s;backdrop-filter:blur(2px)}
.overlay.show{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:92vh;z-index:61;background:var(--bg);border-radius:28px 28px 0 0;
  transform:translate(-50%,100%);transition:transform .42s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.show{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:9px auto 2px;flex:none}
.sheet .sx{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;z-index:2;box-shadow:var(--shadow);display:grid;place-items:center}
.sheet .body{overflow-y:auto;padding:6px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet h2{font-family:var(--font-d);font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
.sheet .hih{font-family:var(--font-h);font-size:16px;color:var(--muted);margin-bottom:10px}
.dish-hero{height:150px;border-radius:24px;display:grid;place-items:center;font-size:76px;margin:8px 0 14px;position:relative;overflow:hidden;background:var(--grad)}
.dish-hero span{animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.dish-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 50%)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:9px;background:var(--accent-weak);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
.tip{background:color-mix(in srgb,var(--prot) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--prot) 25%,transparent);border-radius:14px;padding:10px 12px;font-size:13.5px}
.tip.warn{background:color-mix(in srgb,var(--watch) 13%,var(--surface));border-color:color-mix(in srgb,var(--watch) 30%,transparent)}
/* forms */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:0 12px;font-size:15px;outline:none;transition:border .2s}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:90px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.stepper button{width:52px;height:50px;border:0;background:none;font-size:22px;font-weight:700;cursor:pointer;color:var(--accent)}
.stepper button:active{background:var(--surface-2)}
.stepper .v{flex:1;text-align:center;font-family:var(--font-d);font-size:20px;font-weight:800}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* figure */
.fig{width:100%;display:block}
.fig .limb{stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig-stage{border-radius:24px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 70%);border:1px solid var(--border);margin:8px 0 14px;overflow:hidden}
.fig-thumb{width:56px;height:56px;flex:none;border-radius:16px;background:var(--accent-weak);overflow:hidden}
/* timeline */
.tl{display:grid;gap:8px}
.tl-slot{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 2px 0;display:flex;justify-content:space-between}
.tl .item{padding:9px 10px}
.tl .emo{width:40px;height:40px;font-size:21px;border-radius:12px}
.x{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted);flex:none;font-size:18px}
.x:active{background:var(--surface-2)}
/* habits */
.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hab{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hab .hl{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.hab .hv{font-family:var(--font-d);font-size:20px;font-weight:800}
.hab input{width:100%;border:0;background:var(--surface-2);border-radius:10px;height:36px;padding:0 10px;font-family:var(--font-d);font-weight:700;font-size:16px;outline:none}
.drops{display:flex;gap:3px;flex-wrap:wrap}
.drop{width:15px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--surface-2);border:0;cursor:pointer;transition:background .3s,transform .2s;padding:0}
.drop.on{background:#38bdf8;transform:scale(1.05)}
.tick{border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .25s;text-align:left}
.tick .bx{width:20px;height:20px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;flex:none;transition:all .25s}
.tick.on{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.tick.on .bx{background:var(--good);border-color:var(--good);color:#fff}
.ticks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kg{display:flex;gap:6px}
.kg button{flex:1;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:800;cursor:pointer}
.kg button.on{background:var(--fg);color:var(--bg)}
/* session banner */
.session{display:flex;align-items:center;gap:12px;cursor:pointer}
.session .fig-thumb{width:64px;height:64px}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.chart .gl{stroke:var(--border)}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .bar{transform-origin:bottom;transform-box:fill-box;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:14px}
.empty .ee{font-size:40px;display:block;margin-bottom:6px;animation:bob 3s ease-in-out infinite}
/* rungs */
.rung{display:flex;gap:5px}
.rung button{flex:1;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-weight:800;cursor:pointer;transition:all .2s}
.rung button.on{background:var(--grad);color:#fff;border-color:transparent}
/* toast & confetti */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .4s cubic-bezier(.3,1.5,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;top:-10px;z-index:90;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
.ing-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ing-row .n{flex:1;min-width:0;font-size:14px}
.ing-row .n small{display:block;color:var(--muted);font-family:var(--font-h)}
.ing-row input{width:78px;height:38px}
.sug{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-top:6px;max-height:220px;overflow:auto;box-shadow:var(--shadow)}
.sug div{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px}
.sug div:last-child{border-bottom:0}
.sug div small{color:var(--muted);font-family:var(--font-h);margin-left:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.kv span:nth-child(even){font-weight:700;text-align:right}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v1.1 ===== */
.fig-thumb.media{position:relative;background:#111}
.fig-thumb.media img{width:100%;height:100%;object-fit:cover;display:block}
.photo-stage{position:relative;aspect-ratio:3/2;border-radius:24px;overflow:hidden;background:#111;margin:8px 0 14px;box-shadow:var(--shadow)}
.photo-stage img.f0,.photo-stage img.f1{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 7s ease-in-out infinite alternate}
.photo-stage.two img.f1{animation:xf 3.2s ease-in-out infinite,kb 7s ease-in-out infinite alternate}
@keyframes xf{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
